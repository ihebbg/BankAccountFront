apiVersion: apps/v1
kind: Deployment
metadata:
  name: bankaccount-kube-deployment-front
  labels:
    app: bankaccount
spec:
  replicas: 2
  selector:
    matchLabels:
        app: bankaccount
  template:
    metadata:
      labels:
        app: bankaccount
    spec:
      containers:
        - name: bankaccount-front
          # Build and load this image into Docker Desktop with the command in README.
          image: bankaccount-front:b1d0c97c4dc2c48da9880846a8560de17dda8cbd
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi

---
apiVersion: v1
kind: Service
metadata:
  name: bankaccount-front-service
spec:
  type: NodePort
  selector:
    app: bankaccount
  ports:
    - name: http
      port: 80
      targetPort: 80
