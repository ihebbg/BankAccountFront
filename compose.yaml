services:
  api:
    image: 652197205619.dkr.ecr.us-east-1.amazonaws.com/bankaccount-ecr:services-latest
    build:
      context: ../BankAccountServices
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    image: 652197205619.dkr.ecr.us-east-1.amazonaws.com/bankaccount-ecr:front-latest
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - api
    ports:
      - "8080:80"
    restart: unless-stopped
