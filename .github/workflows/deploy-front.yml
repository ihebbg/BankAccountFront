name: Deploy Angular Front to Kubernetes

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bankaccount-front-docker-desktop
  cancel-in-progress: true

env:
  IMAGE_NAME: bankaccount-front
  DEPLOYMENT: bankaccount-kube-deployment-front
  SERVICE: bankaccount-front-service
  MANIFEST: front-deployment.yaml
  KUBECONFIG: ${{ secrets.KUBECONFIG }}

jobs:
  build-and-deploy:
    name: Build and deploy Angular front to Docker Desktop Kubernetes
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Node.js on self-hosted runner
        shell: powershell
        run: |
          node -v
          npm -v

      - name: Free disk space before install
        shell: powershell
        run: |
          if (Test-Path node_modules) {
            Remove-Item -Recurse -Force node_modules
          }
          npm cache clean --force
          Write-Host "Disk cleanup completed."

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build Angular app
        run: npm run build -- --configuration production

      - name: Check Docker Desktop and Kubernetes
        shell: powershell
        run: |
          docker version
          kubectl version --client=true
          $context = kubectl config current-context
          if ($context -ne 'docker-desktop') {
            throw "Le contexte Kubernetes doit être 'docker-desktop'; actuel : $context"
          }

      - name: Validate kubeconfig secret
        if: ${{ env.KUBECONFIG == '' }}
        shell: powershell
        run: |
          Write-Host "KUBECONFIG is empty. Skipping Kubernetes deployment."

      - name: Build image
        if: ${{ env.KUBECONFIG != '' }}
        shell: powershell
        run: |
          $image = "$env:IMAGE_NAME`:$env:GITHUB_SHA"
          docker build --tag $image .

      - name: Deploy image
        if: ${{ env.KUBECONFIG != '' }}
        shell: powershell
        run: |
          $image = "$env:IMAGE_NAME`:$env:GITHUB_SHA"
          $manifest = Get-Content -Raw $env:MANIFEST
          $updatedManifest = $manifest -replace '(?m)^([ \t]*image:[ \t]*)\S+[ \t]*\r?$', "`${1}$image"

          if ($updatedManifest -eq $manifest) {
            throw "Aucune image n'a été trouvée dans $env:MANIFEST."
          }

          Set-Content -Path $env:MANIFEST -Value $updatedManifest -NoNewline
          kubectl apply -f $env:MANIFEST
          kubectl rollout status "deployment/$env:DEPLOYMENT" --timeout=180s

      - name: Show deployed resources
        if: ${{ env.KUBECONFIG != '' }}
        shell: powershell
        run: |
          kubectl get pods -l app=bankaccount
          kubectl get service $env:SERVICE
